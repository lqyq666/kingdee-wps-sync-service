name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      KINGDEE_MODE: mock
      WPS_MODE: mock
      DATABASE_URL: sqlite+pysqlite:///./ci.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements-dev.lock && python -m pip install --no-deps .
      - name: Compile application
        run: python -m compileall app
      - name: Run tests
        run: pytest
      - name: Build Docker image
        run: docker build .
