services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kingdee_wps_sync
      POSTGRES_USER: sync_user
      # Mock-only local demo: no credential is stored in this repository.
      POSTGRES_HOST_AUTH_METHOD: trust
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sync_user -d kingdee_wps_sync"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  sync-service:
    build: .
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-28080}:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/live')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
